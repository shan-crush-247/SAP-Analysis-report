<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAP Replication Analytics</title>
<style>
:root{
  --bg:#eef1f8; --panel:#ffffff; --panel2:#f6f8fd; --ink:#0f172a; --ink2:#64748b; --line:#e2e7f0;
  --accent:#4f46e5; --accent-ink:#ffffff;
  --good:#15803d; --good-bg:#e7f8ee; --bad:#b91c1c; --bad-bg:#fdecec; --warn:#b45309; --warn-bg:#fdf3e3;
  --muted:#64748b; --muted-bg:#eceff6;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 2px 8px rgba(15,23,42,.06);
  --shadow-lg:0 4px 16px rgba(15,23,42,.10),0 1px 3px rgba(15,23,42,.06);
  --tot-a:#eef2ff; --tot-b:#e0f2fe; --tot-ink:#3730a3;
}
html[data-theme="dark"]{
  --bg:#0b1020; --panel:#141b2d; --panel2:#1a2235; --ink:#e8ecf6; --ink2:#94a3b8; --line:#27314a;
  --accent:#6366f1; --accent-ink:#ffffff;
  --good:#4ade80; --good-bg:#123322; --bad:#f87171; --bad-bg:#3a1418; --warn:#fbbf24; --warn-bg:#3a2a0f;
  --muted:#94a3b8; --muted-bg:#212a3d;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 6px 20px rgba(0,0,0,.5);
  --tot-a:#1e1b4b; --tot-b:#0c2b3f; --tot-ink:#c7d2fe;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
h1,h2,h3{margin:0;font-weight:700}
button{font-family:inherit}
.app{display:flex;min-height:100vh}

.sidebar{width:222px;flex:0 0 222px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:15px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,rgba(79,70,229,.10),rgba(14,165,233,.06))}
.brand-title{font-size:14.5px;font-weight:800}
.brand-sub{font-size:11px;color:var(--ink2);margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:8px}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink2);font-weight:600;font-size:12.2px;margin-bottom:1px;user-select:none;transition:.15s}
.nav-item:hover{background:var(--panel2);color:var(--ink)}
.nav-item.active{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;box-shadow:var(--shadow)}
.nav-icon{width:17px;text-align:center}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;position:sticky;top:0;z-index:40}
.topbar-title h1{font-size:16.5px}
.topbar-sub{font-size:11.5px;color:var(--ink2);margin-top:1px}
.topbar-controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:7px 11px;font-size:12.2px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,#4f46e5,#6366f1);border-color:transparent;color:#fff;box-shadow:var(--shadow)}
.btn.alert{background:linear-gradient(135deg,#f59e0b,#f97316);border-color:transparent;color:#fff;box-shadow:0 0 0 3px rgba(245,158,11,.22)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.workspace{padding:13px 18px 24px;display:flex;flex-direction:column;gap:11px;flex:1}

.block-title{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.block-title:before{content:"";width:4px;height:15px;border-radius:2px;background:linear-gradient(180deg,#4f46e5,#0ea5e9)}
.groupbar{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;font-size:10.8px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#fff;box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:9px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:.18s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kpi-accent,linear-gradient(180deg,#4f46e5,#0ea5e9))}
.kpi .lbl{font-size:10.2px;color:var(--ink2);font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px;line-height:1.25}
.kpi .val{font-size:17.5px;font-weight:800;line-height:1.15}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:11px}
.chart-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow);transition:.18s}
.chart-card:hover{box-shadow:var(--shadow-lg)}
.chart-card h3{font-size:12px;margin-bottom:9px}
.canvas-wrap{position:relative;height:245px}
.note-panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.note-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;cursor:pointer;font-weight:700;font-size:12px}
.note-body{padding:0 12px 12px;font-size:11.8px;color:var(--ink2);line-height:1.5;display:none}
.note-panel.open .note-body{display:block}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.toolbar-left,.toolbar-right{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:6.5px 9px;font-size:12.2px}
#globalSearch{min-width:215px}
.count-badge{font-size:11.5px;color:var(--ink2);font-weight:700}
.ddwrap{position:relative}
.dd-panel{position:absolute;top:calc(100% + 5px);left:0;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow-lg);padding:9px;min-width:215px;max-height:300px;overflow:auto}
.dd-panel label{display:flex;align-items:center;gap:7px;padding:3px;font-size:12px;cursor:pointer;border-radius:5px}
.dd-panel label:hover{background:var(--panel2)}
.dd-actions{display:flex;gap:5px;margin-bottom:5px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.dd-actions button{flex:1;font-size:11px;padding:4px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:5px}

/* Excel-style column filter popup */
.colpop{position:fixed;z-index:90;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);width:290px;padding:10px;display:flex;flex-direction:column;gap:7px}
.colpop .cp-title{font-size:11.5px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colpop input[type=search],.colpop input[type=text]{width:100%}
.colpop .cp-actions{display:flex;gap:6px}
.colpop .cp-actions button{flex:1;font-size:11px;padding:5px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;font-weight:600}
.colpop .cp-list{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:7px;padding:5px}
.colpop .cp-list label{display:flex;align-items:center;gap:7px;padding:3px 4px;font-size:11.8px;cursor:pointer;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colpop .cp-list label:hover{background:var(--panel2)}
.colpop .cp-foot{display:flex;justify-content:space-between;gap:6px}
.colpop .cp-foot button{flex:1;padding:6px;border-radius:6px;font-weight:700;font-size:11.5px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.colpop .cp-foot button.apply{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;border-color:transparent}
.cp-hint{font-size:10.5px;color:var(--ink2)}

.table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto;box-shadow:var(--shadow);max-height:calc(100vh - 250px);min-height:250px}
table.dt{border-collapse:separate;border-spacing:0;width:100%;font-size:12.1px}
table.dt thead th{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--panel2),var(--panel));text-align:left;padding:0 10px;height:36px;font-weight:800;color:var(--ink);border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
table.dt thead th:hover{color:var(--accent)}
table.dt thead th .arrow{margin-left:4px;opacity:.6;font-size:9.5px}
table.dt thead tr.filters th{top:36px;z-index:19;height:33px;padding:0 5px;cursor:default;background:var(--panel2)}
.fbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:5px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:6px;padding:4px 7px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden}
.fbtn:hover{border-color:var(--accent);color:var(--ink)}
.fbtn.on{background:linear-gradient(135deg,rgba(79,70,229,.16),rgba(14,165,233,.13));border-color:var(--accent);color:var(--accent);font-weight:800}
table.dt tbody td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
table.dt tbody tr:hover td{background:var(--panel2)}
table.dt td.num,table.dt th.num{text-align:right;font-variant-numeric:tabular-nums}
th.frz,td.frz{position:sticky;z-index:15;overflow:hidden;text-overflow:ellipsis}
thead th.frz{z-index:30}
thead tr.filters th.frz{z-index:29}
tfoot td.frz{z-index:26}
td.frz{box-shadow:1px 0 0 var(--line)}
table.dt tfoot td{position:sticky;bottom:0;z-index:22;background:linear-gradient(135deg,var(--tot-a),var(--tot-b));border-top:2px solid var(--accent);padding:9px 10px;font-weight:800;white-space:nowrap;color:var(--tot-ink)}
table.dt tfoot td.num{font-size:12.6px}
.empty-row td{text-align:center;color:var(--ink2);padding:26px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.8px;font-weight:700}
.b-good{background:var(--good-bg);color:var(--good)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-accent{background:var(--muted-bg);color:var(--accent)}
.b-muted,.b-neutral{background:var(--muted-bg);color:var(--muted)}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:5px;flex-wrap:wrap}
.pager button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:5px 9px;font-size:11.8px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager .pageinfo{font-size:11.8px;color:var(--ink2);margin-right:6px}
.errbar{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad);border-radius:9px;padding:11px 14px;font-weight:600}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
@media (max-width:980px){.sidebar{width:58px;flex-basis:58px}.brand-sub,.nav-item span.label{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title">SAP Replication Analytics</div>
      <div class="brand-sub">Storage &amp; BI Usage</div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="sectionTitle">Overview &amp; Databases</h1>
        <div class="topbar-sub" id="sectionSub"></div>
      </div>
      <div class="topbar-controls">
        <button class="btn" id="themeBtn">🌙 Dark</button>
        <button class="btn" id="exportXlsxBtn">⤓ Export Excel</button>
        <button class="btn" id="exportHtmlBtn">⤓ Export HTML</button>
        <button class="btn primary" id="refreshBtn">🔄 Refresh</button>
      </div>
    </header>

    <section class="workspace" id="workspace">
      <div id="errBox"></div>
      <div id="overviewBlocks"></div>
      <div class="block-title" id="tableHeading" hidden></div>
      <div class="kpis" id="kpis"></div>
      <div class="charts" id="charts"></div>
      <div class="note-panel" id="notePanel" hidden></div>
      <div class="toolbar" id="toolbar"></div>
      <div class="table-wrap" id="tableWrap"></div>
      <div class="pager" id="pager"></div>
    </section>
  </main>
</div>

<script src="lib/xlsx.full.min.js"></script>
<script src="lib/chart.umd.min.js"></script>
<script src="lib/embedded-data.js"></script>
<script>
"use strict";

/* Column `key` doubles as the display label so headings match the workbook exactly. */
const NAV_ITEMS = [
  {id:"overview",     icon:"🏠", label:"Overview & Databases"},
  {id:"tables",       icon:"📋", label:"Tables"},
  {id:"columns",      icon:"🧬", label:"Columns"},
  {id:"sps",          icon:"⚙️", label:"Stored Procedures"},
  {id:"splineage",    icon:"🔗", label:"SP → Table Lineage"},
  {id:"viewlineage",  icon:"🕸️", label:"View Lineage"},
  {id:"unused",       icon:"🗑️", label:"Unused Tables"},
  {id:"insights",     icon:"💡", label:"Top Insights"},
  {id:"insTables",    icon:"📈", label:"Insertion Trends (Tables)"},
  {id:"insDb",        icon:"📊", label:"Insertion Trends (Databases)"},
  {id:"dailyGrowth",  icon:"🧮", label:"Daily Growth (Estimated)"}
];

const DAILY_GROWTH_NOTE =
 "Estimated, not measured. Each table's average row size is derived from its own catalogue figures "
+"(Data Size (MB) ÷ Row Count) and multiplied by that table's approximate rows written per day, taken "
+"from the busiest-month sampling on the Insertion Trends sheet. 'Cells Inserted Per Day' is the table's "
+"column count × its average inserted rows per day. Coverage is limited to the tables that were sampled "
+"for insertion activity and that also carry catalogue size figures — it is a representative lower bound "
+"for daily growth, not a whole-server total. Tables with no measurable insertion data contribute nothing.";

const SHEET_CONFIGS = {
  databases:{
    sheetCode:"02", headerRow:0, freeze:2,
    title:"Databases", sub:"Per-database storage, object counts and BI usage coverage",
    dbKey:"Database Name",
    dropRow:(r)=>String(r["Database Name"]||"").trim().toUpperCase()==="TOTAL",
    defaultSort:{key:"Replicated Data Size (MB)", dir:"desc"},
    searchable:["Database Name"],
    columns:[
      {key:"Database Name", type:"text"},
      {key:"Table Count", type:"int"},
      {key:"View Count", type:"int"},
      {key:"Proc Count", type:"int"},
      {key:"Column Count", type:"int"},
      {key:"Index Count", type:"int"},
      {key:"Total Rows", type:"int"},
      {key:"Data Size (MB)", type:"size"},
      {key:"Index Size (MB)", type:"size"},
      {key:"Replicated Data Size (MB)", type:"size"},
      {key:"BI Used Tables", type:"int"},
      {key:"BI Unused Tables", type:"int"},
      {key:"Table Usage %", type:"pct"},
      {key:"BI Used Columns", type:"int"},
      {key:"BI Unused Columns", type:"int"},
      {key:"Column Usage %", type:"pct"},
      {key:"SPs Depending on This DB", type:"int"}
    ],
    kpis:(rows)=>[
      {label:"Databases", value:fmtInt(rows.length)},
      {label:"Total Tables", value:fmtInt(sumBy(rows,"Table Count"))},
      {label:"Total Columns", value:fmtInt(sumBy(rows,"Column Count"))},
      {label:"Total Rows", value:fmtInt(sumBy(rows,"Total Rows"))},
      {label:"Replicated Storage", value:fmtSize(sumBy(rows,"Replicated Data Size (MB)"))},
      {label:"BI Used Tables", value:fmtInt(sumBy(rows,"BI Used Tables"))},
      {label:"Avg Table Usage %", value:fmtPct(avgBy(rows,"Table Usage %"))}
    ],
    charts:[
      {title:"Replicated Data Size (MB) by Database — top 15", build:(rows)=>topNBarChart(rows,"Database Name","Replicated Data Size (MB)",15,"GB",1024)},
      {title:"BI Used vs Unused Tables", build:(rows)=>pairDonut(rows,"BI Used Tables","BI Unused Tables")}
    ]
  },
  tables:{
    sheetCode:"03", headerRow:0, freeze:2,
    title:"Tables", sub:"Every replicated SAP table with its BI usage classification and size",
    dbKey:"Database Name",
    defaultSort:{key:"Total Size (MB)", dir:"desc"},
    searchable:["Database Name","Table Name","Primary Key Columns","Usage Classification"],
    columns:[
      {key:"Database Name", type:"text"},
      {key:"Table Name", type:"text"},
      {key:"BI Used?", type:"badge", colorMap:{"Yes":"good","No":"muted"}},
      {key:"Usage Classification", type:"badge", colorMap:{"NOT USED":"bad","LOW USAGE":"warn","MEDIUM USAGE":"accent","HIGH USAGE":"good"}},
      {key:"Available Columns (SAP)", type:"int"},
      {key:"Used Columns", type:"int"},
      {key:"Unused Columns", type:"int"},
      {key:"Column Usage %", type:"pct"},
      {key:"Referencing SPs", type:"int"},
      {key:"Referencing Views", type:"int"},
      {key:"BI Objects Referencing", type:"int"},
      {key:"Total Reference Count", type:"int"},
      {key:"Row Count", type:"int"},
      {key:"Data Size (MB)", type:"size"},
      {key:"Index Size (MB)", type:"size"},
      {key:"Total Size (MB)", type:"size"},
      {key:"Index Count", type:"int"},
      {key:"Primary Key Columns", type:"text"},
      {key:"Optimization Priority Score", type:"num1"}
    ],
    kpis:(rows)=>{
      const used=rows.filter(r=>String(r["BI Used?"]).trim().toLowerCase()==="yes").length;
      return [
        {label:"Tables", value:fmtInt(rows.length)},
        {label:"BI Used", value:fmtInt(used)+" ("+fmtPct(rows.length?used/rows.length*100:0)+")"},
        {label:"Not BI Used", value:fmtInt(rows.length-used)},
        {label:"Total Rows", value:fmtInt(sumBy(rows,"Row Count"))},
        {label:"Total Size", value:fmtSize(sumBy(rows,"Total Size (MB)"))},
        {label:"Avg Optimization Score", value:fmtNum1(avgBy(rows,"Optimization Priority Score"))}
      ];
    },
    charts:[
      {title:"Total Size (MB) — top 15 tables", build:(rows)=>topNBarChart(rows,"Table Name","Total Size (MB)",15,"GB",1024)},
      {title:"Tables by Usage Classification", build:(rows)=>countByChart(rows,"Usage Classification")}
    ]
  },
  columns:{
    sheetCode:"04", headerRow:0, freeze:2,
    title:"Columns", sub:"Column catalogue with data types, keys and BI usage counts",
    dbKey:"Database Name",
    defaultSort:{key:"Usage Count", dir:"desc"},
    searchable:["Database Name","Table Name","Column Name","Data Type"],
    columns:[
      {key:"Database Name", type:"text"},
      {key:"Table Name", type:"text"},
      {key:"Column Name", type:"text"},
      {key:"BI Used?", type:"badge", colorMap:{"Yes":"good","No":"muted"}},
      {key:"Data Type", type:"text"},
      {key:"Max Length", type:"int"},
      {key:"Precision", type:"int"},
      {key:"Scale", type:"int"},
      {key:"Is Nullable", type:"text"},
      {key:"Column Position", type:"int"},
      {key:"Is Primary Key", type:"text"},
      {key:"Usage Count", type:"int"},
      {key:"Usage Types (SELECT / WHERE / JOIN / etc.)", type:"text"},
      {key:"Top BI Consumers (up to 15)", type:"text"}
    ],
    kpis:(rows)=>{
      const used=rows.filter(r=>String(r["BI Used?"]).trim().toLowerCase()==="yes").length;
      return [
        {label:"Columns", value:fmtInt(rows.length)},
        {label:"BI Used", value:fmtInt(used)+" ("+fmtPct(rows.length?used/rows.length*100:0)+")"},
        {label:"Unused", value:fmtInt(rows.length-used)},
        {label:"Primary Key Columns", value:fmtInt(rows.filter(r=>String(r["Is Primary Key"]).toLowerCase()==="true").length)},
        {label:"Total Usage Count", value:fmtInt(sumBy(rows,"Usage Count"))}
      ];
    },
    charts:[
      {title:"Usage Count — top 15 columns", build:(rows)=>topNBarChart(rows,r=>r["Table Name"]+"."+r["Column Name"],"Usage Count",15,"",1)},
      {title:"Columns by BI Used?", build:(rows)=>countByChart(rows,"BI Used?")}
    ]
  },
  sps:{
    sheetCode:"05", headerRow:0, freeze:1,
    title:"Stored Procedures", sub:"BI stored procedures and their dependency complexity on SAP data",
    dbKey:null,
    defaultSort:{key:"ComplexityScore", dir:"desc"},
    searchable:["SPName","DependencyComplexity"],
    columns:[
      {key:"SPName", type:"text"},
      {key:"UsesSAP", type:"badge", colorMap:{"YES":"good","NO":"muted"}},
      {key:"SAPTablesCount", type:"int"},
      {key:"SAPColumnsCount", type:"int"},
      {key:"DirectDependencies", type:"int"},
      {key:"IndirectDependencies", type:"int"},
      {key:"ViewsUsed", type:"int"},
      {key:"HasDynamicSQL", type:"badge", colorMap:{"YES":"warn","NO":"muted"}},
      {key:"ComplexityScore", type:"int"},
      {key:"DependencyComplexity", type:"badge", colorMap:{"Very High":"bad","High":"warn","Medium":"accent","Low":"good"}}
    ],
    kpis:(rows)=>{
      const u=rows.filter(r=>String(r.UsesSAP).trim().toUpperCase()==="YES").length;
      return [
        {label:"Stored Procedures", value:fmtInt(rows.length)},
        {label:"Uses SAP Data", value:fmtInt(u)+" ("+fmtPct(rows.length?u/rows.length*100:0)+")"},
        {label:"No SAP Dependency", value:fmtInt(rows.length-u)},
        {label:"Has Dynamic SQL", value:fmtInt(rows.filter(r=>String(r.HasDynamicSQL).toUpperCase()==="YES").length)},
        {label:"Avg Complexity Score", value:fmtNum1(avgBy(rows,"ComplexityScore"))}
      ];
    },
    charts:[
      {title:"ComplexityScore — top 15 procedures", build:(rows)=>topNBarChart(rows,"SPName","ComplexityScore",15,"",1)},
      {title:"Procedures by DependencyComplexity", build:(rows)=>countByChart(rows,"DependencyComplexity")}
    ]
  },
  splineage:{
    sheetCode:"06", headerRow:1, noteRow:0, freeze:2,
    title:"SP → Table Lineage", sub:"Which SAP tables each stored procedure depends on, directly or through views",
    dbKey:"SAPDatabase",
    defaultSort:{key:"SPName", dir:"asc"},
    searchable:["SPName","SAPTable","SchemaName","DependencyPath"],
    columns:[
      {key:"SPName", type:"text"},
      {key:"SAPDatabase", type:"text"},
      {key:"SchemaName", type:"text"},
      {key:"SAPTable", type:"text"},

/* ------------------------------ formatting ------------------------------ */
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toNum(v){ if(v===""||v==null) return NaN; const n=Number(v); return isNaN(n)?NaN:n; }
function fmtInt(v){ const n=toNum(v); return isNaN(n)?"—":Math.round(n).toLocaleString("en-US"); }
function fmtNum1(v){ const n=toNum(v); return isNaN(n)?"—":n.toLocaleString("en-US",{minimumFractionDigits:1,maximumFractionDigits:1}); }
function fmtPct(v){ const n=toNum(v); return isNaN(n)?"—":n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})+"%"; }
function fmtPctSmall(v){
  const n=toNum(v); if(isNaN(n)) return "—";
  const d=(Math.abs(n)<0.01&&n!==0)?4:2;
  return n.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})+"%";
}
function fmtSize(mb){
  const n=toNum(mb); if(isNaN(n)) return "—";
  const a=Math.abs(n);
  const f=(x,d)=>x.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
  if(a>=1048576) return f(n/1048576,2)+" TB";
  if(a>=1024) return f(n/1024,2)+" GB";
  if(a>=1) return f(n,2)+" MB";
  if(a>=1/1024) return f(n*1024,2)+" KB";
  return f(n*1048576,0)+" bytes";
}
function isNumericType(t){ return t==="int"||t==="num1"||t==="size"; }
function isRightAligned(t){ return isNumericType(t)||t==="pct"||t==="pctsmall"; }
function fmtCell(col,val){
  if(val===""||val==null) return "—";
  switch(col.type){
    case "int": return fmtInt(val);
    case "num1": return fmtNum1(val);
    case "pct": return fmtPct(val);
    case "pctsmall": return fmtPctSmall(val);
    case "size": return fmtSize(val);
    case "badge": return badgeHtml(val,col.colorMap);
    default: return escapeHtml(val);
  }
}
function badgeHtml(value,colorMap){
  const key=String(value).trim();
  if(!key) return "—";
  let cls="neutral";
  if(colorMap){ const f=Object.keys(colorMap).find(k=>k.toLowerCase()===key.toLowerCase()); if(f) cls=colorMap[f]; }
  return '<span class="badge b-'+cls+'">'+escapeHtml(key)+'</span>';
}
function sumBy(rows,key){ let s=0; for(const r of rows){ const n=toNum(r[key]); if(!isNaN(n)) s+=n; } return s; }
function avgBy(rows,key){ let s=0,c=0; for(const r of rows){ const n=toNum(r[key]); if(!isNaN(n)){s+=n;c++;} } return c?s/c:0; }
function distinctCount(rows,key){ return new Set(rows.map(r=>r[key])).size; }

/* ------------- workbook parsing (reused by the regeneration step) ------------- */
function fixSheetRange(ws){
  if(!ws) return ws;
  let maxR=-1,maxC=-1,any=false;
  for(const addr in ws){
    if(addr[0]==="!") continue;
    const c=XLSX.utils.decode_cell(addr);
    if(c.r>maxR)maxR=c.r; if(c.c>maxC)maxC=c.c; any=true;
  }
  if(any) ws["!ref"]=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:maxR,c:maxC}});
  return ws;
}
function findSheet(wb,code){ return wb.SheetNames.find(n=>n.startsWith(code+"_")) || wb.SheetNames.find(n=>n.indexOf(code)===0) || null; }
function sheetToAoa(wb,name){ return XLSX.utils.sheet_to_json(fixSheetRange(wb.Sheets[name]),{header:1,raw:true,defval:""}); }
function overviewCell(aoa,r,c){ const row=aoa[r]; const v=row?row[c]:""; return v==null?"":v; }
function overviewText(aoa,r,c){ return String(overviewCell(aoa,r,c)).trim(); }
function findAnchor(aoa,label,rightLabel){
  for(let r=0;r<aoa.length;r++){
    const row=aoa[r]||[];
    for(let c=0;c<row.length;c++){
      if(overviewText(aoa,r,c).toLowerCase()===label.toLowerCase() && overviewText(aoa,r,c+1).toLowerCase()===rightLabel.toLowerCase()) return {r,c};
    }
  }
  return null;
}
function readAnchoredPairs(aoa,anchor,maxRows){
  const out=[];
  if(!anchor) return out;
  for(let r=anchor.r+1;r<aoa.length&&out.length<maxRows;r++){
    const label=overviewText(aoa,r,anchor.c);
    if(label==="") break;
    out.push({label,value:toNum(overviewCell(aoa,r,anchor.c+1))});
  }
  return out;
}
function parseOverviewSheet(aoa){
  const ov={kpiA:[],kpiB:[],dbStorage:[],status:[],usageLevel:[],spCategory:[]};
  const blocks=[];
  for(let r=0;r<Math.min(aoa.length-1,30);r++){
    const row=aoa[r]||[];
    const cols=[];
    for(let c=0;c<row.length;c++){ if(overviewText(aoa,r,c)!=="") cols.push(c); }
    if(cols.length<3) continue;
    if(cols.some(c=>overviewText(aoa,r,c)!=="" && !isNaN(Number(overviewText(aoa,r,c))))) continue;
    if(!cols.every(c=>overviewText(aoa,r+1,c)!=="")) continue;
    blocks.push(cols.map(c=>({label:overviewText(aoa,r,c),value:overviewText(aoa,r+1,c)})));
    r++;
  }
  ov.kpiA=blocks[0]||[]; ov.kpiB=blocks[1]||[];
  ov.status     = readAnchoredPairs(aoa,findAnchor(aoa,"Status","Tables"),10);
  ov.usageLevel = readAnchoredPairs(aoa,findAnchor(aoa,"Usage Level","Tables"),10);
  ov.spCategory = readAnchoredPairs(aoa,findAnchor(aoa,"SP Category","Count"),10);
  ov.dbStorage  = readAnchoredPairs(aoa,findAnchor(aoa,"Database","Storage GB"),100).map(p=>({db:p.label,gb:p.value}));
  return ov;
}
function aoaToObjects(aoa,headerRowIdx){
  const headers=(aoa[headerRowIdx]||[]).map(h=>String(h).trim());
  const rows=[];
  for(let i=headerRowIdx+1;i<aoa.length;i++){
    const r=aoa[i];
    if(!r||r.every(v=>v===""||v==null)) continue;
    const o={}; let any=false;
    headers.forEach((h,ci)=>{ if(!h) return; const v=r[ci]!==undefined?r[ci]:""; o[h]=v; if(v!=="") any=true; });
    if(any) rows.push(o);
  }
  return rows;
}
function loadWorkbook(arrayBuffer,fileName){
  const wb=XLSX.read(new Uint8Array(arrayBuffer),{type:"array",cellDates:false,raw:true});
  const ovName=findSheet(wb,"01");
  STATE.overview=ovName?parseOverviewSheet(sheetToAoa(wb,ovName)):{kpiA:[],kpiB:[],dbStorage:[],status:[],usageLevel:[],spCategory:[]};
  STATE.data={};
  Object.keys(SHEET_CONFIGS).forEach(id=>{
    const cfg=SHEET_CONFIGS[id];
    if(cfg.derived) return;
    const name=findSheet(wb,cfg.sheetCode);
    if(!name){ STATE.data[id]={rows:[],note:null}; return; }
    const aoa=sheetToAoa(wb,name);
    let rows=aoaToObjects(aoa,cfg.headerRow);
    if(cfg.dropRow) rows=rows.filter(r=>!cfg.dropRow(r));
    const note=(cfg.noteRow!=null&&aoa[cfg.noteRow]&&aoa[cfg.noteRow][0])?String(aoa[cfg.noteRow][0]):null;
    STATE.data[id]={rows,note};
    STATE.sections[id]=freshSectionState(id);
  });
  finalizeData(fileName,"");
}

/* ------------------------------ derived data ------------------------------ */
/* Daily growth: the workbook gives rows-per-day per table but no byte figure, so the
   average row size comes from that table's own catalogue entry (data size ÷ row count). */
function buildDailyGrowth(){
  const cat=new Map();
  (STATE.data.tables?STATE.data.tables.rows:[]).forEach(r=>{
    const db=String(r["Database Name"]||"").trim().toUpperCase();
    const tn=String(r["Table Name"]||"").trim().toLowerCase();
    if(db&&tn) cat.set(db+"|"+tn,r);
  });
  const out=[];
  (STATE.data.insTables?STATE.data.insTables.rows:[]).forEach(r=>{
    const db=String(r["Database Name"]||"").trim();
    const rawName=String(r["Table Name"]||"").trim();
    const bare=rawName.split(".").pop().toLowerCase();
    const t=cat.get(db.toUpperCase()+"|"+bare);
    const cols=t?toNum(t["Available Columns (SAP)"]):NaN;
    const rowCount=t?toNum(t["Row Count"]):NaN;
    const dataMB=t?toNum(t["Data Size (MB)"]):NaN;
    const ins=toNum(r["Avg Inserts Per Day (approx)"]);
    const upd=toNum(r["Avg Updates Per Day (approx)"]);
    const mbPerRow=(!isNaN(dataMB)&&!isNaN(rowCount)&&rowCount>0)?dataMB/rowCount:NaN;
    const insMB=(!isNaN(ins)&&!isNaN(mbPerRow))?ins*mbPerRow:NaN;
    const updMB=(!isNaN(upd)&&!isNaN(mbPerRow))?upd*mbPerRow:NaN;
    const totMB=(isNaN(insMB)&&isNaN(updMB))?NaN:((isNaN(insMB)?0:insMB)+(isNaN(updMB)?0:updMB));
    out.push({
      "Database Name":db,
      "Table Name":rawName,
      "Available Columns (SAP)":isNaN(cols)?"":cols,
      "Row Count":isNaN(rowCount)?"":rowCount,
      "Avg Inserts Per Day (approx)":isNaN(ins)?"":ins,
      "Cells Inserted Per Day":(!isNaN(cols)&&!isNaN(ins))?Math.round(cols*ins):"",
      "Avg Row Size":isNaN(mbPerRow)?"":mbPerRow,
      "Est. Insert Size Per Day (MB)":isNaN(insMB)?"":insMB,
      "Avg Updates Per Day (approx)":isNaN(upd)?"":upd,
      "Est. Update Size Per Day (MB)":isNaN(updMB)?"":updMB,
      "Est. Total Size Per Day (MB)":isNaN(totMB)?"":totMB,
      "Est. Growth Per Day % of Table":(!isNaN(ins)&&!isNaN(rowCount)&&rowCount>0)?(ins/rowCount*100):""
    });
  });
  return out.filter(r=>r["Est. Total Size Per Day (MB)"]!==""||r["Cells Inserted Per Day"]!=="");
}

/* ------------------------------ load ------------------------------ */
function freshSectionState(id){
  return {search:"", colSel:{}, colText:{}, sort:Object.assign({},SHEET_CONFIGS[id].defaultSort), page:1, pageSize:50};
}
function finalizeData(fileName,generated){
  STATE.data.dailyGrowth={rows:buildDailyGrowth(),note:DAILY_GROWTH_NOTE};
  Object.keys(SHEET_CONFIGS).forEach(id=>{ if(!STATE.sections[id]) STATE.sections[id]=freshSectionState(id); });
  const canonical=(STATE.data.databases?STATE.data.databases.rows:[]).map(r=>String(r["Database Name"]||"").trim()).filter(Boolean);
  if(canonical.length){
    STATE.dbUniverse=[...new Set(canonical)].sort((a,b)=>a.localeCompare(b));
  }else{
    const s=new Set();
    Object.keys(SHEET_CONFIGS).forEach(id=>{
      const cfg=SHEET_CONFIGS[id];
      if(!cfg.dbKey||!STATE.data[id]) return;
      STATE.data[id].rows.forEach(r=>{ const v=r[cfg.dbKey]; if(v) s.add(String(v)); });
    });
    STATE.dbUniverse=[...s].sort((a,b)=>a.localeCompare(b));
  }
  STATE.loaded=true; STATE.fileName=fileName; STATE.generated=generated||""; STATE.loadedAt=new Date();
}
async function loadEmbeddedData(gzB64,fileName,generated){
  const bin=atob(gzB64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  const json=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  const packed=JSON.parse(json);
  STATE.overview=packed.overview||{kpiA:[],kpiB:[],dbStorage:[],status:[],usageLevel:[],spCategory:[]};
  STATE.data={};
  Object.keys(SHEET_CONFIGS).forEach(id=>{
    if(SHEET_CONFIGS[id].derived) return;
    const sec=packed.sections?packed.sections[id]:null;
    if(!sec){ STATE.data[id]={rows:[],note:null}; return; }
    const h=sec.headers;
    STATE.data[id]={rows:sec.rows.map(a=>{const o={};for(let i=0;i<h.length;i++)o[h[i]]=a[i];return o;}),note:sec.note||null};
  });
  finalizeData(fileName,packed.generated||generated||"");
}

function anyFilterActive(id){
  const st=STATE.sections[id];
  if(STATE.globalDb.size) return true;
  if(st.search) return true;
  if(Object.keys(st.colText).some(k=>st.colText[k])) return true;
  if(Object.keys(st.colSel).some(k=>st.colSel[k]&&st.colSel[k].size)) return true;
  return false;
}
function rowsAfterFilters(id,skipKey){
  const cfg=SHEET_CONFIGS[id], st=STATE.sections[id];
  let rows=STATE.data[id].rows;
  if(cfg.dbKey && STATE.globalDb.size){
    const sel=new Set([...STATE.globalDb].map(d=>d.toUpperCase()));
    rows=rows.filter(r=>sel.has(String(r[cfg.dbKey]).trim().toUpperCase()));
  }
  Object.keys(st.colSel).forEach(k=>{
    if(k===skipKey) return;
    const set=st.colSel[k];
    if(set&&set.size) rows=rows.filter(r=>set.has(String(r[k]==null?"":r[k])));
  });
  Object.keys(st.colText).forEach(k=>{
    if(k===skipKey) return;
    const t=st.colText[k];
    if(t) rows=rows.filter(r=>String(r[k]==null?"":r[k]).toLowerCase().includes(t));
  });
  if(st.search && cfg.searchable && cfg.searchable.length){
    const q=st.search.trim().toLowerCase();
    if(q) rows=rows.filter(r=>cfg.searchable.some(k=>String(r[k]||"").toLowerCase().includes(q)));
  }
  return rows;
}
function getFilteredSortedRows(id){
  const st=STATE.sections[id];
  let rows=rowsAfterFilters(id,null);
  if(st.sort&&st.sort.key){
    const {key,dir}=st.sort, mul=dir==="desc"?-1:1;
    rows=rows.slice().sort((a,b)=>{
      const an=toNum(a[key]), bn=toNum(b[key]);
      if(!isNaN(an)&&!isNaN(bn)) return (an-bn)*mul;
      return String(a[key]).localeCompare(String(b[key]))*mul;
    });
  }
  return rows;
}

/* ------------------------------ charts ------------------------------ */
const PALETTE=["#4f46e5","#0ea5e9","#16a34a","#f59e0b","#dc2626","#9333ea","#0891b2","#65a30d","#db2777","#475569"];
function shade(hex,pct){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.min(255,Math.max(0,Math.round(r+(pct>0?(255-r)*pct:r*pct))));
  g=Math.min(255,Math.max(0,Math.round(g+(pct>0?(255-g)*pct:g*pct))));
  b=Math.min(255,Math.max(0,Math.round(b+(pct>0?(255-b)*pct:b*pct))));
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function chartColors(n){ const o=[]; for(let i=0;i<n;i++) o.push(PALETTE[i%PALETTE.length]); return o; }
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* Gradient fills + a soft drop shadow give the flat canvas charts a lit, raised look. */
function gradientFor(ctx,area,hex,vertical){
  if(!area) return hex;
  const g=vertical
    ? ctx.createLinearGradient(0,area.bottom,0,area.top)
    : ctx.createLinearGradient(area.left,0,area.right,0);
  g.addColorStop(0,shade(hex,-0.22));
  g.addColorStop(0.55,hex);
  g.addColorStop(1,shade(hex,0.30));
  return g;
}
const depthShadow={
  id:"depthShadow",
  beforeDatasetsDraw(c){ const x=c.ctx; x.save(); x.shadowColor="rgba(15,23,42,.28)"; x.shadowBlur=11; x.shadowOffsetX=0; x.shadowOffsetY=4; },
  afterDatasetsDraw(c){ c.ctx.restore(); }
};
const donutCounts={
  id:"donutCounts",
  afterDatasetsDraw(chart){
    const ctx=chart.ctx, meta=chart.getDatasetMeta(0), data=chart.data.datasets[0].data||[];
    if(!meta.data.length) return;
    const total=data.reduce((a,b)=>a+(+b||0),0);
    ctx.save(); ctx.textAlign="center"; ctx.textBaseline="middle";
    meta.data.forEach((arc,i)=>{
      const v=+data[i]||0;
      if(!v||!total||v/total<0.035) return;
      const p=arc.tooltipPosition();
      const txt=(chart.$fmt?chart.$fmt(v):fmtInt(v))+"  ("+(v/total*100).toFixed(1)+"%)";
      ctx.font="700 11px system-ui,Segoe UI,sans-serif";
      ctx.lineWidth=3.4; ctx.strokeStyle="rgba(15,23,42,.55)"; ctx.strokeText(txt,p.x,p.y);
      ctx.fillStyle="#fff"; ctx.fillText(txt,p.x,p.y);
    });
    const c0=meta.data[0];
    if(c0&&typeof c0.x==="number"){
      ctx.fillStyle=cssVar("--ink"); ctx.font="800 17px system-ui,Segoe UI,sans-serif";
      ctx.fillText(chart.$fmt?chart.$fmt(total):fmtInt(total),c0.x,c0.y-7);
      ctx.fillStyle=cssVar("--ink2"); ctx.font="700 9.5px system-ui,Segoe UI,sans-serif";
      ctx.fillText("TOTAL",c0.x,c0.y+10);
    }
    ctx.restore();
  }
};
function baseOpts(extra){
  const ink=cssVar("--ink"), line=cssVar("--line");
  return Object.assign({
    responsive:true, maintainAspectRatio:false,
    animation:{duration:800,easing:"easeOutQuart"},
    plugins:{legend:{labels:{color:ink,font:{size:10.5},boxWidth:11,usePointStyle:true,pointStyle:"circle"}}},
    scales: extra.indexAxis==="y" ? {
      x:{ticks:{color:ink,font:{size:9.5}},grid:{color:line}},
      y:{ticks:{color:ink,font:{size:9.5}},grid:{display:false}}
    } : undefined
  },extra);
}
function donutSpec(labels,values,fmt){
  const base=chartColors(labels.length);
  return {
    type:"doughnut",
    data:{labels,datasets:[{
      data:values, borderWidth:2, borderColor:cssVar("--panel"),
      hoverOffset:10, hoverBorderColor:cssVar("--panel"),
      backgroundColor:(c)=>{ const a=c.chart.chartArea; return a?gradientFor(c.chart.ctx,a,base[c.dataIndex%base.length],true):base[c.dataIndex%base.length]; }
    }]},
    options:baseOpts({cutout:"54%"}),
    plugins:[depthShadow,donutCounts],
    $fmt:fmt
  };
}
function barSpec(labels,values,label,fmt){
  const base=chartColors(labels.length);
  return {
    type:"bar",
    data:{labels,datasets:[{
      label, data:values, borderRadius:6, borderSkipped:false, maxBarThickness:26,
      backgroundColor:(c)=>{ const a=c.chart.chartArea; return a?gradientFor(c.chart.ctx,a,base[c.dataIndex%base.length],false):base[c.dataIndex%base.length]; }
    }]},
    options:baseOpts({indexAxis:"y"}),
    plugins:[depthShadow],
    $fmt:fmt
  };
}
function topNBarChart(rows,labelKey,valueKey,n,unit,divisor){
  const get=typeof labelKey==="function"?labelKey:(r)=>r[labelKey];
  const items=rows.map(r=>({label:String(get(r)),value:toNum(r[valueKey])||0})).sort((a,b)=>b.value-a.value).slice(0,n);
  return barSpec(
    items.map(i=>i.label.length>30?i.label.slice(0,28)+"…":i.label),
    items.map(i=>divisor?+(i.value/divisor).toFixed(2):i.value),
    valueKey+(unit?(" ("+unit+")"):"")
  );
}
function countTopNChart(rows,key,n){
  const m=new Map();
  rows.forEach(r=>{const k=String(r[key]||"—");m.set(k,(m.get(k)||0)+1);});
  const items=[...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,n);
  return barSpec(items.map(i=>i[0].length>30?i[0].slice(0,28)+"…":i[0]),items.map(i=>i[1]),"Rows");
}
function countByChart(rows,key){
  const m=new Map();
  rows.forEach(r=>{const k=String(r[key]||"—");m.set(k,(m.get(k)||0)+1);});
  const e=[...m.entries()].sort((a,b)=>b[1]-a[1]);
  return donutSpec(e.map(x=>x[0]),e.map(x=>x[1]));
}
function sumByDonut(rows,groupKey,valueKey,n){
  const m=new Map();
  rows.forEach(r=>{const k=String(r[groupKey]||"—");m.set(k,(m.get(k)||0)+(toNum(r[valueKey])||0));});
  const items=[...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,n);
  const isSize=/MB/i.test(valueKey);
  return donutSpec(items.map(i=>i[0]),items.map(i=>+i[1].toFixed(2)),isSize?fmtSize:fmtInt);
}
function pairDonut(rows,a,b){ return donutSpec([a,b],[sumBy(rows,a),sumBy(rows,b)]); }
function makeChart(canvasId,spec,reg){
  const el=document.getElementById(canvasId);
  if(!el) return;
  const ch=new Chart(el,spec);
  if(spec.$fmt) ch.$fmt=spec.$fmt;
  reg.push(ch);
}
function destroyCharts(reg){ reg.forEach(c=>{try{c.destroy()}catch(e){}}); reg.length=0; }

function renderOverviewBlocks(root){
  const ov=STATE.overview, all=[...(ov.kpiA||[]),...(ov.kpiB||[])], used=new Set();
  let html='<div style="display:flex;flex-direction:column;gap:11px">';
  OVERVIEW_GROUPS.forEach(g=>{
    const items=all.filter((k,i)=>{
      if(used.has(i)) return false;
      const hit=g.match.some(m=>k.label.indexOf(m)>-1);
      if(hit) used.add(i);
      return hit;
    });
    if(!items.length) return;
    html+='<div><div class="groupbar" style="background:'+g.grad+'">'+escapeHtml(g.title)+'</div>'
       + '<div class="kpis" style="margin-top:7px">'
       + items.map(k=>'<div class="kpi" style="--kpi-accent:'+g.grad+'"><div class="lbl">'+escapeHtml(k.label)+'</div><div class="val">'+escapeHtml(k.value)+'</div></div>').join("")
       + '</div></div>';
  });
  const rest=all.filter((k,i)=>!used.has(i));
  if(rest.length){
    html+='<div><div class="groupbar" style="background:linear-gradient(135deg,#64748b,#94a3b8)">Other Metrics</div>'
       + '<div class="kpis" style="margin-top:7px">'

       + '</div></div>';
  }
  html+='<div><div class="groupbar" style="background:linear-gradient(135deg,#0f766e,#14b8a6)">Distribution</div><div class="charts" style="margin-top:7px">'
    + [["ovStorage","Replicated Storage by Database (GB)"],["ovStatus","Table Usage Status"],
       ["ovLevel","Usage Level (BI-used tables)"],["ovSp","Stored Procedure Category"]]
      .map(([id,t])=>'<div class="chart-card"><h3>'+t+'</h3><div class="canvas-wrap"><canvas id="'+id+'"></canvas></div></div>').join("")
    + '</div></div></div>';
  root.innerHTML=html;

  const stor=(ov.dbStorage||[]).slice().sort((a,b)=>b.gb-a.gb);
  makeChart("ovStorage",barSpec(stor.map(s=>s.db),stor.map(s=>s.gb),"Storage (GB)"),OVERVIEW_CHARTS);
  makeChart("ovStatus",donutSpec((ov.status||[]).map(s=>s.label),(ov.status||[]).map(s=>s.value)),OVERVIEW_CHARTS);
  makeChart("ovLevel",donutSpec((ov.usageLevel||[]).map(s=>s.label),(ov.usageLevel||[]).map(s=>s.value)),OVERVIEW_CHARTS);
  makeChart("ovSp",donutSpec((ov.spCategory||[]).map(s=>s.label),(ov.spCategory||[]).map(s=>s.value)),OVERVIEW_CHARTS);
}

function dbFilterHtml(){
  const label=STATE.globalDb.size?STATE.globalDb.size+" DB selected":"All Databases";

function wireDbFilter(id){
  const btn=document.getElementById("dbBtn"), panel=document.getElementById("dbPanel");
  btn.addEventListener("click",e=>{ e.stopPropagation(); panel.style.display=panel.style.display==="none"?"block":"none"; });
  document.addEventListener("click",e=>{ if(panel&&!panel.contains(e.target)&&e.target!==btn) panel.style.display="none"; });
  panel.querySelectorAll("input[data-db]").forEach(cb=>{
    cb.addEventListener("change",()=>{
      if(cb.checked) STATE.globalDb.add(cb.dataset.db); else STATE.globalDb.delete(cb.dataset.db);
      btn.textContent="🗄️ "+(STATE.globalDb.size?STATE.globalDb.size+" DB selected":"All Databases")+" ▾";
      btn.classList.toggle("alert",STATE.globalDb.size>0);

  document.getElementById("dbAll").addEventListener("click",()=>{ STATE.globalDb.clear(); renderSectionShell(id); });

}

/* Frozen leading columns keep the identifying pair visible while scrolling sideways. */
const FRZ_W=[178,150];
function freezeStyle(cfg,idx){
  const n=cfg.freeze||0;
  if(idx>=n) return "";
  const left=FRZ_W.slice(0,idx).reduce((a,b)=>a+b,0);
  const w=FRZ_W[idx]||150;
  return 'left:'+left+'px;width:'+w+'px;min-width:'+w+'px;max-width:'+w+'px;';
}
function buildTableShell(id){
  const cfg=SHEET_CONFIGS[id], st=STATE.sections[id];

    +cfg.columns.map((c,i)=>'<th class="'+(isRightAligned(c.type)?"num ":"")+(i<(cfg.freeze||0)?"frz":"")+'" style="'+freezeStyle(cfg,i)+'" data-key="'+escapeHtml(c.key)+'" title="'+escapeHtml(c.key)+'">'+escapeHtml(c.key)+' <span class="arrow" data-arrow="'+escapeHtml(c.key)+'"></span></th>').join("")
    +'</tr><tr class="filters">'
    +cfg.columns.map((c,i)=>'<th class="'+(i<(cfg.freeze||0)?"frz":"")+'" style="'+freezeStyle(cfg,i)+'"><button class="fbtn" data-fkey="'+escapeHtml(c.key)+'"><span data-flabel="'+escapeHtml(c.key)+'">All</span><span>▾</span></button></th>').join("")
    +'</tr></thead><tbody id="dtBody"></tbody><tfoot id="dtFoot"></tfoot>';

/* --------------------- Excel-style per-column filter --------------------- */
let COLPOP=null;
function closeColPop(){ if(COLPOP){ COLPOP.remove(); COLPOP=null; } }
document.addEventListener("click",e=>{ if(COLPOP && !COLPOP.contains(e.target)) closeColPop(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeColPop(); });

function openColPop(id,key,anchor){
  closeColPop();
  const cfg=SHEET_CONFIGS[id], st=STATE.sections[id];
  const col=cfg.columns.find(c=>c.key===key);
  const base=rowsAfterFilters(id,key);
  const counts=new Map();
  for(const r of base){ const v=String(r[key]==null?"":r[key]); counts.set(v,(counts.get(v)||0)+1); }
  const values=[...counts.keys()].sort((a,b)=>{
    const an=Number(a), bn=Number(b);
    if(a!==""&&b!==""&&!isNaN(an)&&!isNaN(bn)) return an-bn;
    return a.localeCompare(b);
  });
  const selected=st.colSel[key]?new Set(st.colSel[key]):new Set();

  const pop=document.createElement("div");
  pop.className="colpop";
  pop.innerHTML=
     '<div class="cp-title">'+escapeHtml(key)+'</div>'
    +'<input type="text" id="cpText" placeholder="Text contains…" value="'+escapeHtml(st.colText[key]||"")+'">'
    +'<input type="search" id="cpSearch" placeholder="Search values…">'
    +'<div class="cp-actions"><button id="cpAll">Select all</button><button id="cpNone">Clear</button></div>'
    +'<div class="cp-list" id="cpList"></div>'
    +'<div class="cp-hint" id="cpHint"></div>'
    +'<div class="cp-foot"><button id="cpReset">Reset column</button><button class="apply" id="cpApply">Apply</button></div>';
  document.body.appendChild(pop);
  COLPOP=pop;

  const r=anchor.getBoundingClientRect();
  pop.style.top=Math.min(window.innerHeight-380,r.bottom+5)+"px";
  pop.style.left=Math.min(window.innerWidth-300,Math.max(6,r.left))+"px";

  const list=pop.querySelector("#cpList"), hint=pop.querySelector("#cpHint");
  const LIMIT=600;
  function paint(q){
    const ql=(q||"").toLowerCase();
    const shown=values.filter(v=>!ql||v.toLowerCase().includes(ql));
    const slice=shown.slice(0,LIMIT);
    list.innerHTML=slice.map(v=>{
      const disp=col&&col.type!=="text"&&col.type!=="badge"&&v!==""?fmtCell(col,v):(v===""?"(blank)":escapeHtml(v));
      return '<label title="'+escapeHtml(v)+'"><input type="checkbox" value="'+escapeHtml(v)+'" '+(selected.has(v)?"checked":"")+'> <span>'+disp+'</span> <span style="margin-left:auto;color:var(--ink2);font-size:10.5px">'+fmtInt(counts.get(v))+'</span></label>';
    }).join("") || '<div class="cp-hint">No values</div>';
    hint.textContent = shown.length>LIMIT
      ? "Showing first "+LIMIT.toLocaleString()+" of "+shown.length.toLocaleString()+" values — narrow with search, or use 'Text contains'."
      : shown.length.toLocaleString()+" distinct value"+(shown.length===1?"":"s");
    list.querySelectorAll("input[type=checkbox]").forEach(cb=>{
      cb.addEventListener("change",()=>{ if(cb.checked) selected.add(cb.value); else selected.delete(cb.value); });
    });
  }
  paint("");
  pop.querySelector("#cpSearch").addEventListener("input",e=>paint(e.target.value));
  pop.querySelector("#cpAll").addEventListener("click",()=>{ values.forEach(v=>selected.add(v)); paint(pop.querySelector("#cpSearch").value); });
  pop.querySelector("#cpNone").addEventListener("click",()=>{ selected.clear(); paint(pop.querySelector("#cpSearch").value); });
  pop.querySelector("#cpReset").addEventListener("click",()=>{
    delete st.colSel[key]; delete st.colText[key]; st.page=1;
    closeColPop(); refreshSection(id);
  });
  pop.querySelector("#cpApply").addEventListener("click",()=>{
    const txt=pop.querySelector("#cpText").value.trim().toLowerCase();
    if(txt) st.colText[key]=txt; else delete st.colText[key];
    if(selected.size && selected.size!==values.length) st.colSel[key]=selected; else delete st.colSel[key];
    st.page=1; closeColPop(); refreshSection(id);
  });
  pop.querySelector("#cpText").addEventListener("keydown",e=>{ if(e.key==="Enter") pop.querySelector("#cpApply").click(); });
}

/* ------------------------------ rendering ------------------------------ */
function refreshSection(id){
  const cfg=SHEET_CONFIGS[id];
  const rows=getFilteredSortedRows(id);

  document.getElementById("kpis").innerHTML=cfg.kpis(rows).map((k,i)=>{
    const g=["linear-gradient(180deg,#4f46e5,#7c3aed)","linear-gradient(180deg,#0ea5e9,#06b6d4)","linear-gradient(180deg,#16a34a,#65a30d)","linear-gradient(180deg,#f59e0b,#f97316)","linear-gradient(180deg,#db2777,#9333ea)"][i%5];
    return '<div class="kpi" style="--kpi-accent:'+g+'"><div class="lbl">'+escapeHtml(k.label)+'</div><div class="val">'+escapeHtml(String(k.value))+'</div></div>';
  }).join("");

  destroyCharts(SECTION_CHARTS);
  document.getElementById("charts").innerHTML=(cfg.charts||[]).map((c,i)=>
    '<div class="chart-card"><h3>'+escapeHtml(c.title)+'</h3><div class="canvas-wrap"><canvas id="secChart'+i+'"></canvas></div></div>').join("");
  (cfg.charts||[]).forEach((c,i)=>makeChart("secChart"+i,c.build(rows),SECTION_CHARTS));

  const total=STATE.data[id].rows.length;
  document.getElementById("countBadge").textContent = rows.length===total
    ? fmtInt(rows.length)+" rows"
    : fmtInt(rows.length)+" of "+fmtInt(total)+" rows";

  updateFilterButtons(id);
  renderRows(id,rows);
}
function renderRows(id,rows){
  const cfg=SHEET_CONFIGS[id], st=STATE.sections[id];
  const pageCount=Math.max(1,Math.ceil(rows.length/st.pageSize));
  if(st.page>pageCount) st.page=pageCount;
  const start=(st.page-1)*st.pageSize;
  const pageRows=rows.slice(start,start+st.pageSize);

  document.getElementById("dtBody").innerHTML = pageRows.length
    ? pageRows.map(r=>'<tr>'+cfg.columns.map((c,i)=>{
        const cls=(isRightAligned(c.type)?"num ":"")+(i<(cfg.freeze||0)?"frz":"");
        const raw=r[c.key]==null?"":String(r[c.key]);
        return '<td class="'+cls.trim()+'" style="'+freezeStyle(cfg,i)+'" title="'+escapeHtml(raw)+'">'+fmtCell(c,r[c.key])+'</td>';
      }).join("")+'</tr>').join("")
    : '<tr class="empty-row"><td colspan="'+cfg.columns.length+'">No rows match the current filters.</td></tr>';

  document.getElementById("dtFoot").innerHTML=totalsRowHtml(cfg,rows);

  document.getElementById("pager").innerHTML=
     '<span class="pageinfo">Showing '+fmtInt(rows.length?start+1:0)+'–'+fmtInt(Math.min(start+st.pageSize,rows.length))+' of '+fmtInt(rows.length)+' · page '+st.page+' of '+pageCount+'</span>'
    +'<button id="pgFirst" '+(st.page<=1?"disabled":"")+'>« First</button>'
    +'<button id="pgPrev" '+(st.page<=1?"disabled":"")+'>‹ Prev</button>'
    +'<button id="pgNext" '+(st.page>=pageCount?"disabled":"")+'>Next ›</button>'
    +'<button id="pgLast" '+(st.page>=pageCount?"disabled":"")+'>Last »</button>';
  const go=p=>{ st.page=Math.min(Math.max(1,p),pageCount); renderRows(id,rows); };
  const b=(i,f)=>{ const e=document.getElementById(i); if(e) e.addEventListener("click",f); };
  b("pgFirst",()=>go(1)); b("pgPrev",()=>go(st.page-1)); b("pgNext",()=>go(st.page+1)); b("pgLast",()=>go(pageCount));
}
/* Totals cover every filtered row, not just the visible page. */
function totalsRowHtml(cfg,rows){
  let labelled=false;
  return '<tr>'+cfg.columns.map((c,i)=>{
    const frz=i<(cfg.freeze||0)?" frz":"";
    const style=freezeStyle(cfg,i);
    if(isNumericType(c.type)) return '<td class="num'+frz+'" style="'+style+'">'+fmtCell(c,sumBy(rows,c.key))+'</td>';
    if(c.type==="pct"||c.type==="pctsmall") return '<td class="num'+frz+'" style="'+style+'">'+(c.type==="pct"?fmtPct(avgBy(rows,c.key)):fmtPctSmall(avgBy(rows,c.key)))+' avg</td>';
    const cell=!labelled?("TOTAL · "+fmtInt(rows.length)+" rows"):"";
    labelled=true;
    return '<td class="'+frz.trim()+'" style="'+style+'">'+cell+'</td>';
  }).join("")+'</tr>';
}

/* ------------------------------ export ------------------------------ */
function activeTableId(){ return tableSectionOf(STATE.current); }
function safeName(id){ return SHEET_CONFIGS[id].title.replace(/[^\w]+/g,"_"); }
function filterSummary(id){
  const st=STATE.sections[id], p=[];
  if(STATE.globalDb.size) p.push("Databases: "+[...STATE.globalDb].join(", "));
  if(st.search) p.push('Search: "'+st.search+'"');
  Object.keys(st.colText).forEach(k=>{ if(st.colText[k]) p.push(k+' contains "'+st.colText[k]+'"'); });
  Object.keys(st.colSel).forEach(k=>{ const s=st.colSel[k]; if(s&&s.size) p.push(k+": "+s.size+" value"+(s.size===1?"":"s")+" selected"); });
  return p.length?p.join(" · "):"No filters applied (full dataset)";
}
function exportExcel(){
  const id=activeTableId(), cfg=SHEET_CONFIGS[id], rows=getFilteredSortedRows(id);
  const aoa=[cfg.columns.map(c=>c.key)];
  rows.forEach(r=>aoa.push(cfg.columns.map(c=>{
    const v=r[c.key];
    return (v===""||v==null)?"":(isNaN(Number(v))?v:Number(v));
  })));
  aoa.push(cfg.columns.map(c=>isNumericType(c.type)?sumBy(rows,c.key):(c.type==="pct"||c.type==="pctsmall"?avgBy(rows,c.key):"")));
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,cfg.title.slice(0,31));
  XLSX.writeFile(wb,"SAP_Replication_"+safeName(id)+".xlsx");
}
function exportHtml(){
  const id=activeTableId(), cfg=SHEET_CONFIGS[id], rows=getFilteredSortedRows(id);
  const imgs=[...OVERVIEW_CHARTS,...SECTION_CHARTS].map(c=>{try{return c.canvas.toDataURL("image/png")}catch(e){return null}}).filter(Boolean);
  const nc=c=>isRightAligned(c.type)?' class="num"':"";
  const body=rows.map(r=>'<tr>'+cfg.columns.map(c=>{
    let v=fmtCell(c,r[c.key]);
    if(c.type==="badge"){ const k=String(r[c.key]||"").trim(); v=k?escapeHtml(k):"—"; }
    return '<td'+nc(c)+'>'+v+'</td>';
  }).join("")+'</tr>').join("");
  const totals='<tr class="tot">'+cfg.columns.map((c,i)=>{
    if(isNumericType(c.type)) return '<td class="num">'+fmtCell(c,sumBy(rows,c.key))+'</td>';
    if(c.type==="pct"||c.type==="pctsmall") return '<td class="num">'+(c.type==="pct"?fmtPct(avgBy(rows,c.key)):fmtPctSmall(avgBy(rows,c.key)))+' avg</td>';
    return '<td>'+(i===0?"TOTAL · "+fmtInt(rows.length)+" rows":"")+'</td>';
  }).join("")+'</tr>';
  const html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+escapeHtml(cfg.title)+' — SAP Replication Analytics</title>'
    +'<style>body{font-family:Segoe UI,Arial,sans-serif;background:#eef1f8;color:#0f172a;margin:0;padding:26px}'
    +'h1{font-size:18px;margin:0 0 4px}.meta{color:#64748b;font-size:12px;margin-bottom:16px}'
    +'.charts{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}.chart{background:#fff;border:1px solid #e2e7f0;border-radius:10px;padding:10px;max-width:460px}'
    +'.chart img{max-width:100%}table{border-collapse:collapse;width:100%;font-size:11.5px;background:#fff}'
    +'th,td{padding:6px 9px;border-bottom:1px solid #e2e7f0;text-align:left;white-space:nowrap}'
    +'th{background:#eef2ff;position:sticky;top:0}td.num,th.num{text-align:right}'
    +'tr.tot td{font-weight:800;background:linear-gradient(135deg,#eef2ff,#e0f2fe);color:#3730a3;border-top:2px solid #4f46e5}'
    +'.wrap{overflow:auto;border:1px solid #e2e7f0;border-radius:10px;max-height:80vh}</style></head><body>'
    +'<h1>SAP Replication Analytics — '+escapeHtml(cfg.title)+'</h1>'
    +'<div class="meta">Source: '+escapeHtml(STATE.fileName)+' · Exported '+new Date().toLocaleString()+' · '+fmtInt(rows.length)+' rows · '+escapeHtml(filterSummary(id))+'</div>'
    +(imgs.length?'<div class="charts">'+imgs.map(s=>'<div class="chart"><img src="'+s+'"></div>').join("")+'</div>':"")
    +'<div class="wrap"><table><thead><tr>'+cfg.columns.map(c=>'<th'+nc(c)+'>'+escapeHtml(c.key)+'</th>').join("")+'</tr></thead><tbody>'
    +(body||'<tr><td colspan="'+cfg.columns.length+'" style="text-align:center;color:#64748b;padding:18px">No rows</td></tr>')
    +totals+'</tbody></table></div></body></html>';
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));
  a.download="SAP_Replication_"+safeName(id)+".html";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

/* ------------------------------ boot ------------------------------ */
function showError(m){ document.getElementById("errBox").innerHTML='<div class="errbar">'+escapeHtml(m)+'</div>'; }
async function loadData(){
  const d=window.EMBEDDED_DATA;
  if(!d||!d.gz) throw new Error("lib/embedded-data.js is missing or empty — regenerate it from the workbook.");
  await loadEmbeddedData(d.gz,d.name||"Embedded dataset",d.generated||"");
}
async function boot(){
  try{ await loadData(); document.getElementById("errBox").innerHTML=""; navigate(STATE.current); }
  catch(err){ console.error(err); showError("Could not load the report data: "+err.message); }
}
async function refreshAll(){
  const btn=document.getElementById("refreshBtn");
  btn.disabled=true; const old=btn.textContent; btn.textContent="⏳ Refreshing…";
  const keep={current:STATE.current,db:new Set(STATE.globalDb),sections:STATE.sections};
  try{
    await loadData();
    STATE.sections=keep.sections; STATE.globalDb=keep.db;
    document.getElementById("errBox").innerHTML="";
    navigate(keep.current);
  }catch(err){ console.error(err); showError("Refresh failed: "+err.message); }
  finally{ btn.disabled=false; btn.textContent=old; }
}

document.getElementById("refreshBtn").addEventListener("click",refreshAll);
document.getElementById("exportXlsxBtn").addEventListener("click",exportExcel);
document.getElementById("exportHtmlBtn").addEventListener("click",exportHtml);
document.getElementById("themeBtn").addEventListener("click",()=>{
  const h=document.documentElement, dark=h.getAttribute("data-theme")==="dark";
  h.setAttribute("data-theme",dark?"light":"dark");
  document.getElementById("themeBtn").textContent=dark?"🌙 Dark":"☀️ Light";
  try{ localStorage.setItem("sapRepTheme",dark?"light":"dark"); }catch(e){}
  if(STATE.loaded) navigate(STATE.current);
});
try{
  if(localStorage.getItem("sapRepTheme")==="dark"){
    document.documentElement.setAttribute("data-theme","dark");
    document.getElementById("themeBtn").textContent="☀️ Light";
  }
}catch(e){}

renderNav();
boot();
</script>
